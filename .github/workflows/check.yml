name: Check Foundry extensions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm test
      - name: Require committed generated payloads
        run: git diff --exit-code -- extensions
  vestra-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: amabee/Vestra
          ref: b00340063027b09a8cca5a7936fc3b2428849422
          path: .compat/vestra
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .compat/vestra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Use this checkout's extension sources
        shell: pwsh
        run: Copy-Item -Path extensions/* -Destination .compat/vestra/extensions -Recurse -Force
      - run: pnpm install --frozen-lockfile
        working-directory: .compat/vestra
      - run: pnpm --filter @vestra/extension-host test
        working-directory: .compat/vestra
      - run: node apps/nova/scripts/test-bundled-extensions.mjs
        working-directory: .compat/vestra
      - name: Replay native manga and anime fixtures in the Vestra sandbox
        run: pnpm test:sandbox
        env:
          VESTRA_CHECKOUT: ${{ github.workspace }}/.compat/vestra
